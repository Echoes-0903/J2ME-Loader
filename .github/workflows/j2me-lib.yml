name: J2ME embedding library

on:
  push:
    branches:
      - master
      - "codex/**"
    tags:
      - "j2me-lib-v*"
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Maven package version
        required: true
        default: 1.8.2-external-output.7

concurrency:
  group: j2me-lib-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: write
  packages: write

env:
  J2ME_NDK_VERSION: 27.1.12297006

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android packages
        shell: bash
        run: sdkmanager "platforms;android-34" "ndk;${J2ME_NDK_VERSION}"

      - name: Resolve Maven version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#j2me-lib-v}"
            if [[ -z "${version}" || "${version}" == "${GITHUB_REF_NAME}" ]]; then
              echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="1.8.2-external-output-SNAPSHOT"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Test and build release AAR and Maven repository
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon \
            -Pj2meEmbeddingBuild \
            -Pj2meNdkVersion="${J2ME_NDK_VERSION}" \
            -Pj2meVersion="${{ steps.version.outputs.version }}" \
            :j2me-lib:testDebugUnitTest \
            :j2me-lib:assembleRelease \
            :j2me-lib:publishReleasePublicationToIntegrationRepository

      - name: Verify 16 KB ELF alignment
        shell: bash
        run: |
          set -euo pipefail
          aar="j2me-lib/build/outputs/aar/j2me-lib-release.aar"
          extract_dir="${RUNNER_TEMP}/j2me-aar"
          readelf="${ANDROID_SDK_ROOT}/ndk/${J2ME_NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          rm -rf "${extract_dir}"
          mkdir -p "${extract_dir}"
          unzip -q "${aar}" 'jni/*.so' -d "${extract_dir}"
          mapfile -d '' libraries < <(find "${extract_dir}/jni" -name '*.so' -print0)
          if (( ${#libraries[@]} == 0 )); then
            echo "No shared libraries found in ${aar}" >&2
            exit 1
          fi

          failed=0
          for library in "${libraries[@]}"; do
            echo "Checking ${library#${extract_dir}/}"
            while read -r alignment; do
              echo "  LOAD alignment ${alignment}"
              if (( alignment < 0x4000 )); then
                failed=1
              fi
            done < <("${readelf}" -lW "${library}" | awk '$1 == "LOAD" { print $NF }')
          done
          if (( failed != 0 )); then
            echo "One or more ELF LOAD segments are not aligned for 16 KB pages." >&2
            exit 1
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: j2me-loader-${{ steps.version.outputs.version }}
          if-no-files-found: error
          path: |
            j2me-lib/build/outputs/aar/j2me-lib-release.aar
            j2me-lib/build/repo/**

      - name: Publish GitHub Packages Maven artifact
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ./gradlew --no-daemon \
            -Pj2meEmbeddingBuild \
            -Pj2meNdkVersion="${J2ME_NDK_VERSION}" \
            -Pj2meVersion="${{ steps.version.outputs.version }}" \
            :j2me-lib:publishReleasePublicationToGitHubPackagesRepository

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          aar="j2me-lib/build/outputs/aar/j2me-lib-release.aar"
          pom="j2me-lib/build/repo/ru/playsoftware/j2meloader/j2me-loader/${RELEASE_VERSION}/j2me-loader-${RELEASE_VERSION}.pom"

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${aar}#j2me-loader-${RELEASE_VERSION}.aar" "${pom}" --clobber
          else
            gh release create "${tag}" \
              "${aar}#j2me-loader-${RELEASE_VERSION}.aar" \
              "${pom}" \
              --verify-tag \
              --title "J2ME embedding library ${RELEASE_VERSION}" \
              --generate-notes
          fi
