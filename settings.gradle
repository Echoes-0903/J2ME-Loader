pluginManagement {
    repositories {
        mavenLocal()
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        mavenLocal()
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}
rootProject.name = "J2ME Loader"
include ':dexlib', ':j2me-lib'
if (!gradle.startParameter.projectProperties.containsKey('j2meEmbeddingBuild')) {
    include ':app'
}
